version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 20
        - nvm use 20
        - cd client
        - npm install
        - npm install --no-save @parcel/watcher-linux-x64-glibc --legacy-peer-deps
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        # Ensure we are in the client folder
        - if [ -d "client" ]; then cd client; fi
        - npm install
        # === THIS IS THE FIX ===
        # Force install the Linux version of Rollup (Vite's dependency)
        - npm install --no-save @rollup/rollup-linux-x64-gnu --legacy-peer-deps
    build:
      commands:
        - nvm install 20
        - nvm use 20
        - if [ -d "client" ]; then cd client; fi
        - npm run build
  artifacts:
    baseDirectory: client/dist
    files:
      - "**/*"
  cache:
    paths:
      - client/node_modules/**/*
