version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 20
        - nvm use 20
        # Go to client folder
        - cd client
        - npm install
        - npm install --no-save @parcel/watcher-linux-x64-glibc --legacy-peer-deps
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        # SAFETY CHECK: Only enter 'client' if we are at the root
        - if [ -d "client" ]; then cd client; fi
        - npm install
    build:
      commands:
        - nvm install 20
        - nvm use 20
        # SAFETY CHECK: Ensure we are in the right place
        - if [ -d "client" ]; then cd client; fi
        - npm run build
  artifacts:
    baseDirectory: client/dist
    files:
      - "**/*"
  cache:
    paths:
      - client/node_modules/**/*
