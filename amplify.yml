version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 20
        - nvm use 20
        - cd client
        # CHANGED: Use 'npm install' to fetch the Linux version of parcel/watcher
        - npm install --no-save @parcel/watcher-linux-x64-glibc
        # === DEBUG START ===
        - echo "!!!! DEBUG: LISTING AMPLIFY FILES !!!!"
        - ls -R amplify
        # === DEBUG END ===
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - cd client
        - npm install
    build:
      commands:
        - nvm install 20
        - nvm use 20
        - cd client
        - npm run build
  artifacts:
    baseDirectory: client/dist
    files:
      - "**/*"
  cache:
    paths:
      - client/node_modules/**/*
