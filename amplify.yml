version: 1
applications:
  - appRoot: client/src
    backend:
      phases:
        build:
          commands:
            - npm ci --prefix ..
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --prefix ..
        build:
          commands:
            - npm run build --prefix ..
      artifacts:
        baseDirectory: ../dist
        files:
          - "**/*"
      cache:
        paths:
          - ../node_modules/**/*
