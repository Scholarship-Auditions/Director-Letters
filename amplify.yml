version: 1
backend:
  phases:
    build:
      commands:
        # Skip Amplify backend deployment when no backend is defined
        - |
          if [ -d amplify/backend ]; then
            cd client
            npm ci
            npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
          else
            echo "No Amplify backend found; skipping backend deployment"
          fi
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --prefix client
    build:
      commands:
        - npm run build --prefix client
  artifacts:
    # Point to the dist folder inside client
    baseDirectory: client/dist
    files:
      - "**/*"
  cache:
    paths:
      - client/node_modules/**/*
