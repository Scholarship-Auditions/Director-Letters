version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 20
        - nvm use 20
        # Enter the client folder
        - cd client
        # 1. Install dependencies
        - npm install
        # 2. Force install the Linux watcher (Fixes the crash)
        - npm install --no-save @parcel/watcher-linux-x64-glibc --legacy-peer-deps
        # 3. Deploy
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - cd client
        - npm install
    build:
      commands:
        - nvm install 20
        - nvm use 20
        - cd client
        - npm run build
  artifacts:
    baseDirectory: client/dist
    files:
      - "**/*"
  cache:
    paths:
      - client/node_modules/**/*
